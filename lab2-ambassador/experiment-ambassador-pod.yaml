apiVersion: v1
kind: Pod
metadata:
  name: experiment-example
spec:
  containers:
    - name: nginx
      image: nginx:stable
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
      volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
  volumes:
    - name: config
      configMap:
        name: experiment-config
