apiVersion: v1
kind: Pod
metadata:
  name: ambassador-example
spec:
  containers:
    - name: twemproxy
      image: anchorfree/twemproxy:latest
      imagePullPolicy: IfNotPresent
      command:
        - nutcracker
        - -c
        - /etc/config/nutcracker.yaml
        - -v
        - '7'
        - -s
        - '6222'
      volumeMounts:
        - name: config-volume
          mountPath: /etc/config
  volumes:
    - name: config-volume
      configMap:
        name: twem-config
